<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Crystal Lin</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#FFF9F6">
    <meta name="color-scheme" content="light dark">
    <!-- Night mode and more contrast, as chosen on the main page (or the device's setting) -->
    <script>
        (() => {
            const root = document.documentElement;
            const saved = {};
            try { ['theme', 'contrast'].forEach((k) => { saved[k] = localStorage.getItem(k); }); } catch (e) {}
            const dark = saved.theme ? saved.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
            root.dataset.theme = dark ? 'dark' : 'light';
            if (saved.contrast ? saved.contrast === 'more' : matchMedia('(prefers-contrast: more)').matches) root.dataset.contrast = 'more';
            document.querySelector('meta[name="theme-color"]').content = dark ? '#221921' : '#FFF9F6';
        })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preload" href="/assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* The same two fonts as the main page, from this site (this page can be served from any address, so the
           paths start at the root) */
        @font-face {
            font-family: "Fredoka";
            font-style: normal;
            font-weight: 300 700;
            font-display: swap;
            src: url("/assets/fonts/fredoka-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: "Nunito";
            font-style: normal;
            font-weight: 200 1000;
            font-display: swap;
            src: url("/assets/fonts/nunito-latin.woff2") format("woff2");
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --cream: #FFF9F6;
            --pink-100: #FCE4EC;
            --pink-200: #F8C8D8;
            --pink-300: #F3A6BF;
            --rose: #B03A5E;
            --rose-dark: #8E2C4B;
            --mint-200: #BFE9D6;
            --mint-700: #1B5E47;
            --ink: #4A3640;
            --ink-2: #6F5962;
            --white: #FFFFFF;
            --on-rose: #FFFFFF;
            --rose-hover: #A2355A;
            color-scheme: light;
        }

        /* Night mode, the same colors as the main page */
        :root[data-theme="dark"] {
            --cream: #221921;
            --pink-100: #45283A;
            --pink-200: #5A3549;
            --pink-300: #B4708F;
            --rose: #F48FB1;
            --rose-dark: #B85C7E;
            --mint-200: #2F5546;
            --mint-700: #8FE0BD;
            --ink: #F7E9EF;
            --ink-2: #D6C1CB;
            --white: #2E222B;
            --on-rose: #2A1520;
            --rose-hover: #F8A9C4;
            color-scheme: dark;
        }

        :root[data-contrast="more"] { --ink-2: var(--ink); }

        * { box-sizing: border-box; }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px 16px;
            background: var(--cream);
            background-image: radial-gradient(var(--pink-200) 2.6px, transparent 3.2px);
            background-size: 30px 30px;
            color: var(--ink);
            font-family: "Nunito", "Segoe UI", sans-serif;
            line-height: 1.6;
        }

        .card {
            max-width: 520px;
            padding: 2.25rem 1.75rem 2.5rem;
            border: 2px solid var(--mint-200);
            border-radius: 36px;
            background: var(--white);
            box-shadow: 0 8px 0 var(--mint-200);
            text-align: center;
        }

        .cat {
            width: 150px;
            height: 150px;
            margin: 0 auto 1rem;
            overflow: hidden;
            border: 6px dotted var(--pink-300);
            border-radius: 50%;
            background: var(--pink-100);
        }

        .cat img { display: block; width: 100%; height: 100%; }

        .code {
            margin: 0;
            font-family: "Fredoka", sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--rose);
        }

        h1 {
            margin: 0.2rem 0 0;
            font-family: "Fredoka", "Trebuchet MS", sans-serif;
            font-size: clamp(2rem, 7vw, 2.6rem);
            font-weight: 600;
            line-height: 1.15;
        }

        p.lede { margin: 0.8rem 0 1.6rem; color: var(--ink-2); font-size: 1.08rem; }

        a.home {
            display: inline-block;
            padding: 0.8rem 1.4rem;
            border-radius: 999px;
            background: var(--rose);
            box-shadow: 0 5px 0 var(--rose-dark);
            color: var(--on-rose);
            font-weight: 700;
            text-decoration: none;
        }

        a.home:hover { background: var(--rose-hover); }
        a.home:focus-visible { outline: 3px solid var(--mint-700); outline-offset: 4px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="cat"><img src="/assets/img/portrait-placeholder.svg" alt="" width="400" height="400"></div>
        <p class="code">404</p>
        <h1>This page wandered off for a snack</h1>
        <p class="lede">The link might be mistyped, or the page may have moved. Everything else is right this way.</p>
        <a class="home" href="/">Back to Crystal's page</a>
    </main>
</body>
</html>
